[project]
name = "testplat-control"
version = "0.1.0"
description = "通用接口自动化测试平台 - 控制层"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "testplat team" }
]
dependencies = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "packaging>=24.0",
    # GSB 调用身份与结构化模板需要 Engine 0.5.2；保留九键 auth / cache_scope。
    # 具体 commit 由 uv sources 锁定；见文件下方 [tool.uv.sources] 说明。
    "testplat-engine>=0.5.2,<0.6",
    "pydantic-settings>=2.16.0",
    "cryptography>=50.0.2",
    "argon2-cffi>=25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
# 远程精确锁定：GSB 结构化模板与调用身份所需的 Engine 0.5.2。
# 包含请求覆盖及凭据透传扩展；无需本地 editable，不依赖分支后续移动。
testplat-engine = { git = "https://github.com/JiavinI/testplat-engine.git", rev = "7ae2c013a976da62074d4f4d28b86e8220bbed6d" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "platform_auth: 不注入默认平台用户，走真实 cookie 会话",
    "legacy_git_config: 显式验证历史 Git 环境及 auth 兼容路径",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
