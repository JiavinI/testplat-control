[project]
name = "testplat-control"
version = "0.1.0"
description = "通用接口自动化测试平台 - 控制层"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "testplat team" }
]
dependencies = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "packaging>=24.0",
    # Phase 3.3d：跨执行登录缓存与 401 重登重发需要 Engine 0.5.x（九键 auth / cache_scope）。
    # 具体 commit 由 uv sources 锁定；见文件下方 [tool.uv.sources] 说明。
    "testplat-engine>=0.5.0,<0.6",
    "pydantic-settings>=2.16.0",
    "cryptography>=50.0.2",
    "argon2-cffi>=25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
# 远程精确锁定：Engine main 合并 commit 5231fb47（tag v0.5.0 / PR #15）。锁定精确 rev，不是分支名，也不是 path editable。
testplat-engine = { git = "https://github.com/JiavinI/testplat-engine.git", rev = "5231fb470dbb7a23b0d44489c49e2b8e88da7d36" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "platform_auth: 不注入默认平台用户，走真实 cookie 会话",
    "legacy_git_config: 显式验证历史 Git 环境及 auth 兼容路径",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
