[project]
name = "testplat-control"
version = "0.1.0"
description = "通用接口自动化测试平台 - 控制层"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "testplat team" }
]
dependencies = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "packaging>=24.0",
    # Phase 3.3a：静态 header 凭证需要 Engine 0.3.x（AuthTable / StaticHeaderAuth / 公开 auth 字段）。
    # 具体 commit 由 uv sources 锁定；见文件下方 [tool.uv.sources] 说明。
    "testplat-engine>=0.3.0,<0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
# 临时本地锁定（Phase 3.3a 开发期）：指向已审查的 Engine commit f631e2e
# （分支 codex/phase3-3-engine-auth，尚未推送）。锁定的是精确 rev，不是分支名，也不是 path editable。
# ！！合并前必须改为远程精确锁定（https://github.com/JiavinI/testplat-engine.git + 合并后的 rev），
# 并重新执行 `uv lock`。切勿改成 path editable 或在运行时修改 sys.path。
testplat-engine = { git = "file:///Users/jiavin/Developer/products/testplat1/testplat-engine", rev = "f631e2e3f9e2bad146a9182062ae0d99ea5c62b5" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
