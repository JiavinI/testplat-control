[project]
name = "testplat-control"
version = "0.1.0"
description = "通用接口自动化测试平台 - 控制层"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "testplat team" }
]
dependencies = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "packaging>=24.0",
    # Phase 3：Case 能力需要 Engine 0.2.x（CaseExecutionRequest/Outcome、InvalidInputError）。
    # 具体 commit 由 uv sources 锁定；见文件下方“临时本地 URL”说明。
    "testplat-engine>=0.2.0,<0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
# 远程精确锁定：指向 GitHub 上 Engine 集成分支 codex/phase3-integration-engine 的 commit
# （3bfd0fd，包含已审查的 aff3ca6）。锁定的是精确 rev，不是分支名，也不是 path editable。
# Engine PR 合并后，请改为合并后 main 的 commit SHA 并重新执行 `uv lock`：
#   testplat-engine = { git = "https://github.com/JiavinI/testplat-engine.git", rev = "<合并后的 main commit>" }
# 切勿改成 path editable 或在运行时修改 sys.path。
testplat-engine = { git = "https://github.com/JiavinI/testplat-engine.git", rev = "3bfd0fd0adb230135b47fd31c4579d123959600e" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
