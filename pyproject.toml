[project]
name = "testplat-control"
version = "0.1.0"
description = "通用接口自动化测试平台 - 控制层"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "testplat team" }
]
dependencies = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "packaging>=24.0",
    # Phase 3.3d：跨执行登录缓存与 401 重登重发需要 Engine 0.5.x（九键 auth / cache_scope）。
    # 具体 commit 由 uv sources 锁定；见文件下方 [tool.uv.sources] 说明。
    "testplat-engine>=0.5.0,<0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
# 临时 file:// 锁定 Agent 1 已审查 commit 9fef3a82（Engine 0.5.0）。
# 合并前必须改为远程精确锁定（同 3.3b 流程）；不得 path editable。
testplat-engine = { git = "file:///Users/jiavin/Developer/products/testplat1/testplat-engine", rev = "9fef3a82e8269b2b30e536b31b9347cc7683e092" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
