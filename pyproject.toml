[project]
name = "testplat-control"
version = "0.1.0"
description = "通用接口自动化测试平台 - 控制层"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "testplat team" }
]
dependencies = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "packaging>=24.0",
    # Phase 3：Case 能力需要 Engine 0.2.x（CaseExecutionRequest/Outcome、InvalidInputError）。
    # 具体 commit 由 uv sources 锁定；见文件下方“临时本地 URL”说明。
    "testplat-engine>=0.2.0,<0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
# 【临时方案 · 必须在合并前替换】
# Engine 0.2 的已审查 commit aff3ca6 位于本地仓库分支 codex/phase3-engine-case-runtime，
# 尚未推送到远程，远程 URL 无法解析该 rev，所以这里临时指向本机 file:// 仓库，
# 并锁定到精确 commit（不是分支名，更不是 path editable）。
# 这条依赖只在本机可用：换机器 / CI / 其他开发者都会解析失败。
# Engine 推送并合并后，请改为：
#   testplat-engine = { git = "https://github.com/JiavinI/testplat-engine.git", rev = "<合并后的 main commit>" }
# 然后重新执行 `uv lock`，让 uv.lock 同步指向远程 URL 与合并后的 rev。
# 切勿改成 path editable 或在运行时修改 sys.path。
testplat-engine = { git = "file:///Users/jiavin/Developer/products/testplat1/testplat-engine", rev = "aff3ca6a26d3a2b5bae9449008a9b911124e31aa" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
