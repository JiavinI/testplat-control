[project]
name = "testplat-control"
version = "0.1.0"
description = "通用接口自动化测试平台 - 控制层"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "testplat team" }
]
dependencies = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "packaging>=24.0",
    # Phase 3.3a：静态 header 凭证需要 Engine 0.3.x（AuthTable / StaticHeaderAuth / 公开 auth 字段）。
    # 具体 commit 由 uv sources 锁定；见文件下方 [tool.uv.sources] 说明。
    "testplat-engine>=0.3.0,<0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
# 远程精确锁定：Engine main 合并 commit 8564040（tag v0.3.0）。锁定精确 rev，不是分支名，也不是 path editable。
testplat-engine = { git = "https://github.com/JiavinI/testplat-engine.git", rev = "8564040add59c027e5d2aa7edb8f56b6693a5960" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
