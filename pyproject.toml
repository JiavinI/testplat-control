[project]
name = "testplat-control"
version = "0.1.0"
description = "通用接口自动化测试平台 - 控制层"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "testplat team" }
]
dependencies = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "packaging>=24.0",
    # Phase 3.3b：登录鉴权需要 Engine 0.4.x（LoginAuth / logins / 七键 auth）。
    # 具体 commit 由 uv sources 锁定；见文件下方 [tool.uv.sources] 说明。
    # 合并前必须改为远程精确锁定（勿保留 file://）。
    "testplat-engine>=0.4.0,<0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
# 临时 file:// 锁定：Agent 1 已审查 Engine commit 7a7ebb8（0.4.0，分支 codex/phase3-3b-engine-login）。
# 合并前必须改为远程精确锁定（https://github.com/JiavinI/testplat-engine.git + 已推送 rev），不得 path editable。
testplat-engine = { git = "file:///Users/jiavin/Developer/products/testplat1/testplat-engine", rev = "7a7ebb8c47eb3a81e978c7346470618d181d4309" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
