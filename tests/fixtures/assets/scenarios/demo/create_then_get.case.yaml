schema_version: "0.2"
id: case.demo.create_then_get
name: 创建并查询资源
desc: 创建资源后用返回 ID 查询
tags: [smoke]
params:
  resource_name: demo
steps:
  - step_id: create
    type: api
    api_id: api.demo.create
    name: 创建资源
    params:
      name: "${params.resource_name}"
    output: created
  - step_id: get
    type: api
    api_id: api.demo.get
    params:
      resource_id: "${created.body.id}"
